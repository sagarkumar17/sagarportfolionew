<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" role="img" aria-label="">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2230"/>
      <stop offset="45%" stop-color="#2a3344"/>
      <stop offset="100%" stop-color="#0f1218"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#dc1618" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#dc1618" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4a5568" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4558"/>
      <stop offset="100%" stop-color="#1c222d"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3545"/>
      <stop offset="100%" stop-color="#151a22"/>
    </linearGradient>
    <radialGradient id="moon" cx="78%" cy="18%" r="12%">
      <stop offset="0%" stop-color="#f0ede6" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f0ede6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0ede6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Original Sagar plate — abstract night terrain, not James valley art -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="1240" cy="160" r="90" fill="url(#moon)"/>
  <path d="M0 520 C200 470 360 500 520 455 C700 400 820 430 980 390 C1180 340 1320 380 1600 350 L1600 900 L0 900 Z" fill="url(#ridge)" opacity="0.9"/>
  <path d="M0 620 C180 580 340 610 500 575 C720 520 900 560 1100 530 C1280 505 1420 540 1600 520 L1600 900 L0 900 Z" fill="url(#mid)"/>
  <!-- Abstract product “blocks” as terrain accents -->
  <g opacity="0.55">
    <rect x="980" y="420" width="70" height="110" rx="4" fill="#0f1218"/>
    <rect x="1060" y="380" width="90" height="150" rx="4" fill="#171c26"/>
    <rect x="1160" y="450" width="55" height="80" rx="4" fill="#0f1218"/>
    <rect x="1225" y="400" width="75" height="130" rx="4" fill="#1a2030"/>
    <rect x="320" y="500" width="60" height="90" rx="4" fill="#12161f"/>
    <rect x="390" y="470" width="80" height="120" rx="4" fill="#1a2030"/>
  </g>
  <g opacity="0.35">
    <rect x="1000" y="440" width="18" height="12" fill="#dc1618"/>
    <rect x="1080" y="400" width="22" height="14" fill="#dc1618"/>
    <rect x="1245" y="430" width="16" height="10" fill="#f0ede6"/>
  </g>
  <path d="M0 760 C260 720 520 780 800 740 C1100 695 1360 750 1600 720 L1600 900 L0 900 Z" fill="#0a0c10" opacity="0.85"/>
